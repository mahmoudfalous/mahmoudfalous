name: Refresh profile cards

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install approved card sources on first run
        if: ${{ hashFiles('scripts/render_readme_cards.py') == '' }}
        env:
          APPROVED_PACKAGE: 
        run: |
          python - <<'PYCODE'
          import os, base64, io, tarfile, pathlib, shutil
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(os.environ['APPROVED_PACKAGE'])), mode='r:gz') as archive:
              archive.extractall('.', filter='data')
          pathlib.Path('assets').mkdir(exist_ok=True)
          shutil.copyfile('new.jpeg', 'assets/new.jpeg')
          PYCODE
      - name: Refresh public calendar
        run: python scripts/fetch_contributions.py
      - name: Render animated cards
        run: python scripts/render_readme_cards.py
      - name: Commit changed cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md cards/ scripts/ fonts/ assets/ data/contributions.json data/public-repos.json
          if git diff --cached --quiet; then
            echo 'No card changes'
            exit 0
          fi
          git commit -m 'chore: refresh profile cards [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Push failed after three attempts' >&2
          exit 1
